name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    env:
      # dbt parse reads the profile but never connects
      DATABRICKS_HOST: example.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/example
      DATABRICKS_TOKEN: unused
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dbt]"
      - run: dbt parse
