name: build

on:
  schedule:
    # 02:45 in Bangkok, between two ingest runs
    - cron: "45 19 * * *"
  push:
    branches: [main]
    paths: ["dbt/**", "dashboard/**", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dbt:
    if: vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install ".[dbt]"

      - name: Copy new files from the landing volume
        run: |
          dbt run-operation create_landing
          dbt run-operation load_landing

      - name: Build and test
        run: dbt build --exclude-resource-type unit_test

      # Unit tests read the column types of the tables they cover, so they run once
      # those tables exist, and before anything is published.
      - name: Unit tests
        run: dbt test --select test_type:unit

      - name: Check the hourly ingest is keeping up
        run: dbt source freshness

      - name: Export the dashboard data
        run: python dashboard/export.py site/data

      - name: Add the page and the model docs
        run: |
          cp dashboard/index.html dashboard/app.js dashboard/style.css site/
          dbt docs generate --static
          mkdir site/docs
          cp dbt/target/static_index.html site/docs/index.html
          touch site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 7

  # GitHub Pages serves the gh-pages branch, which holds only the latest build.
  publish:
    needs: dbt
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Push the site to gh-pages
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Site built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
