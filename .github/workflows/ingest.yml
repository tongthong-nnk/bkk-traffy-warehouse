name: ingest

on:
  schedule:
    # GitHub starts only some scheduled runs: 4 of the 16 hourly ones on
    # 8 November 2026, and none for seven and a half hours at one point. So the
    # schedule asks four times an hour, away from the top of the hour when GitHub
    # drops the most, and a run pulls only when the last pull started at least
    # 45 minutes ago. Each pull re-reads yesterday and today, so a missed hour
    # loses no ticket.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: First Bangkok date, YYYY-MM-DD (empty for yesterday)
        required: false
      end:
        description: Last Bangkok date, YYYY-MM-DD (empty for today)
        required: false
  # the backfill workflow calls this once per year
  workflow_call:
    inputs:
      start: {type: string, required: false}
      end: {type: string, required: false}

concurrency:
  # Scheduled runs queue behind each other; a backfill runs beside them.
  group: ingest-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      # A run started by hand or by the backfill always pulls. When the check
      # itself fails, the run pulls anyway.
      - name: Check when the last pull ran
        id: due
        if: github.event_name == 'schedule' && vars.DATABRICKS_HOST != ''
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          due=$(python -m ingest due --minutes 45)
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Pull tickets
        if: steps.due.outputs.due != 'false'
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m ingest pull --out out ${START:+--start "$START"} ${END:+--end "$END"}

      - name: Upload to the landing volume
        if: steps.due.outputs.due != 'false' && vars.DATABRICKS_HOST != ''
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m ingest upload out

      # Keep the files when they could not reach the volume (before the workspace
      # is connected, or when the upload fails) so no history is lost. They can be
      # uploaded later with `python -m ingest upload`.
      - name: Keep the files as an artifact
        if: steps.due.outputs.due != 'false' && (failure() || vars.DATABRICKS_HOST == '')
        uses: actions/upload-artifact@v6
        with:
          name: traffy-${{ inputs.start || 'latest' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
          retention-days: 90
