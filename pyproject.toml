[project]
name = "bkk-traffy-warehouse"
version = "0.1.0"
description = "Bangkok's Traffy Fondue tickets, modelled with dbt on Databricks"
requires-python = ">=3.12"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dbt = ["dbt-databricks~=1.13"]

[tool.setuptools]
packages = ["ingest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ingest/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
